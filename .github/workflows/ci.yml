name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LANG: C.UTF-8

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cargo test
      run: cargo test --workspace
    - name: Cargo clippy
      run: cargo clippy --workspace -- -D warnings
    - name: Cargo fmt
      run: cargo fmt --check
